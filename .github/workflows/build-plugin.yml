name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iikoFront plugin
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore and build
        run: >
          msbuild src\Bellissimo.IikoFront.LoyaltyPlugin\Bellissimo.IikoFront.LoyaltyPlugin.csproj
          /restore
          /p:Configuration=Release
          /p:Platform="Any CPU"

      - name: Stage plugin files
        shell: pwsh
        run: |
          $output = "src\Bellissimo.IikoFront.LoyaltyPlugin\bin\Any CPU\Release\net472"
          $stage = "artifacts\Bellissimo.IikoFront.LoyaltyPlugin"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$output\Bellissimo.IikoFront.LoyaltyPlugin.dll" $stage
          Copy-Item "$output\Bellissimo.IikoFront.LoyaltyPlugin.dll.config" $stage
          Copy-Item "$output\Manifest.xml" $stage
          Copy-Item "$output\Newtonsoft.Json.dll" $stage -ErrorAction SilentlyContinue

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bellissimo.IikoFront.LoyaltyPlugin
          path: artifacts/Bellissimo.IikoFront.LoyaltyPlugin
          if-no-files-found: error
