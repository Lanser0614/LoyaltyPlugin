name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: # ручной запуск через кнопку в GitHub Actions

jobs:
  build:
    name: Build & Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x" # SDK для сборки net472 через modern toolchain

      - name: Restore dependencies
        run: dotnet restore src/Bellissimo.IikoFront.LoyaltyPlugin/Bellissimo.IikoFront.LoyaltyPlugin.csproj

      - name: Build
        run: >
          dotnet build
          src/Bellissimo.IikoFront.LoyaltyPlugin/Bellissimo.IikoFront.LoyaltyPlugin.csproj
          --configuration Release
          --no-restore
          -warnaserror
