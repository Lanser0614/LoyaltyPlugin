name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    permissions:
      contents: write # нужно для создания GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore and build release
        run: >
          msbuild src\Bellissimo.IikoFront.LoyaltyPlugin\Bellissimo.IikoFront.LoyaltyPlugin.csproj
          /restore
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /warnaserror

      - name: Package plugin
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $outDir = "src/Bellissimo.IikoFront.LoyaltyPlugin/bin/Release/net472"
          $zipName = "BellissimoLoyaltyPlugin-$version.zip"

          $files = @(
            "$outDir/Bellissimo.IikoFront.LoyaltyPlugin.dll",
            "$outDir/Manifest.xml",
            "$outDir/Bellissimo.IikoFront.LoyaltyPlugin.dll.config"
          )

          Compress-Archive -Path $files -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Bellissimo Loyalty Plugin ${{ github.ref_name }}"
          body: |
            ## Установка

            1. Скачай `BellissimoLoyaltyPlugin-${{ github.ref_name }}.zip`
            2. Распакуй все файлы в папку `Plugins` iikoFront
            3. Пропиши реальные значения в `Bellissimo.IikoFront.LoyaltyPlugin.dll.config`
            4. Перезапусти iikoFront

            > Не забудь заменить `PluginLicenseModuleId` GUID на реальный из портала iiko.
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.0.0-beta → prerelease
